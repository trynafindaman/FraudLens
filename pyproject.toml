[tool.pylint.messages_control]
disable = [
    "invalid-name",          # Allow standard data science variables like X, y, df
    "too-many-arguments",    # Complex pipeline signatures
    "too-many-locals",
    "too-many-statements",
    "duplicate-code",
]
max-line-length = 100

[tool.bandit]
exclude_dirs = ["tests", ".pytest_cache", "data"]
skips = ["B101"]             # Allow assert in tests

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "__pycache__",
    "data",
]

[tool.ruff.lint]
ignore = ["E501"]
